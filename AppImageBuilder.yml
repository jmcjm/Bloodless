# Recipe for appimage-builder: bundles Python, PyGObject, GTK 4 and libadwaita from Ubuntu 24.04.
version: 1
script:
  - rm -rf AppDir
  - mkdir -p AppDir/usr/lib/python3/dist-packages AppDir/usr/share/applications
  - mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps AppDir/usr/share/metainfo
  - cp -r bloodless AppDir/usr/lib/python3/dist-packages/
  - cp data/io.github.jmcjm.Bloodless.desktop AppDir/usr/share/applications/
  - cp data/io.github.jmcjm.Bloodless.svg AppDir/usr/share/icons/hicolor/scalable/apps/
  - cp data/io.github.jmcjm.Bloodless.metainfo.xml AppDir/usr/share/metainfo/

AppDir:
  path: ./AppDir
  app_info:
    id: io.github.jmcjm.Bloodless
    name: Bloodless
    icon: io.github.jmcjm.Bloodless
    version: !ENV ${VERSION}
    exec: usr/bin/python3
    exec_args: -m bloodless $@
  apt:
    arch: amd64
    sources:
      - sourceline: deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ noble main universe
        key_url: http://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C
      - sourceline: deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ noble-updates main universe
    include:
      - python3
      - python3-gi
      - gir1.2-gtk-4.0
      - gir1.2-adw-1
      - adwaita-icon-theme
      - librsvg2-common
      - shared-mime-info
    exclude:
      - humanity-icon-theme
      - ubuntu-mono
      - systemd
      - dbus
  files:
    exclude:
      - usr/share/man
      - usr/share/doc
      - usr/share/locale
      - usr/include
  runtime:
    # Plain $APPDIR on purpose: the ${APPDIR} form is expanded at build time from the
    # environment of appimage-builder itself, which runs as an AppImage and has it set.
    env:
      PYTHONHOME: $APPDIR/usr
      PYTHONPATH: $APPDIR/usr/lib/python3/dist-packages
      GI_TYPELIB_PATH: $APPDIR/usr/lib/x86_64-linux-gnu/girepository-1.0
      GSETTINGS_SCHEMA_DIR: $APPDIR/usr/share/glib-2.0/schemas
      XDG_DATA_DIRS: $APPDIR/usr/share:/usr/local/share:/usr/share

AppImage:
  arch: x86_64
  update-information: None
