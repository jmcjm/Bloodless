name: AppImage

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils fakeroot desktop-file-utils libgdk-pixbuf2.0-dev \
            patchelf squashfs-tools zsync gtk-update-icon-cache libglib2.0-bin
      - name: Get appimage-builder
        run: |
          wget -q -O appimage-builder \
            https://github.com/AppImageCrafters/appimage-builder/releases/download/v1.1.0/appimage-builder-1.1.0-x86_64.AppImage
          echo "4b4f99cae9291d78ba12dbdabca7c0a67c72aa61eb2e5d424089171a9485e96f  appimage-builder" | sha256sum -c
          chmod +x appimage-builder
      - name: Build
        run: |
          sudo install -m 755 appimage-builder /usr/local/bin/appimage-builder
          packaging/build-appimage.sh
      # No mouse on the runner or in the container: reaching "no Bloody mouse found" proves
      # that the bundled Python and the package start.
      - name: Smoke test on the runner
        run: |
          chmod +x Bloodless-*.AppImage
          ./Bloodless-*.AppImage info 2>&1 | tee smoke.log || true
          grep -q "no Bloody mouse found" smoke.log
      - name: Smoke test on an older glibc (Debian 12)
        run: |
          docker run --rm -e APPIMAGE_EXTRACT_AND_RUN=1 -v "$PWD:/work:ro" debian:12 \
            sh -c '/work/Bloodless-*.AppImage info' 2>&1 | tee smoke-old.log || true
          grep -q "no Bloody mouse found" smoke-old.log
      - uses: actions/upload-artifact@v7
        with:
          name: Bloodless-AppImage
          path: Bloodless-*.AppImage
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: Bloodless-*.AppImage
